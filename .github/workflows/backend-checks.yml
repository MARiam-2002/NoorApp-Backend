name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: noor_test
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: noor_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U noor_test -d noor_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://noor_test:ci_test_only@localhost:5432/noor_test
      DIRECT_URL: postgresql://noor_test:ci_test_only@localhost:5432/noor_test
      JWT_SECRET: ci_only_access_secret_at_least_32_characters
      JWT_REFRESH_SECRET: ci_only_refresh_secret_at_least_32_characters
      REMINDER_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch pinned hadith editions used by the content citation checks
        run: node scripts/fetch-hadith-editions.cjs
      - run: npm run prisma:deploy
      - name: Seed the test database (Quran text from the committed cache, no network)
        run: npm run prisma:seed
      - run: npm run typecheck
      - name: Run every test script
        env:
          SECURITY_DB_TEST: "true"
          ADHKAR_REMINDER_TEST_DB: "true"
          ADHKAR_TEST_DB: "true"
          CONTINUITY_TEST_DB: "true"
          FAJR_ALARM_TEST_DB: "true"
          FASTING_TEST_DB: "true"
          HIFZ_TEST_DB: "true"
          HOME_LAYOUT_TEST_DB: "true"
          JOURNEY_TEST_DB: "true"
          KAHF_TEST_DB: "true"
          LEARNING_TEST_DB: "true"
          PRAYER_MARK_TEST_DB: "true"
          QURAN_SEARCH_TEST_DB: "true"
          READING_TEST_DB: "true"
          READING_TEST_HTTP: "true"
          TRAVEL_TEST_DB: "true"
          WARSH_TEST_DB: "true"
          WARSH_TEST_HTTP: "true"
        # Every test:* script in package.json runs on every push, so a new test can never be left out of CI.
        # test:account-delete skips itself unless API_BASE names a server (it never touches production by default).
        run: |
          fail=0
          for t in $(node -e "console.log(Object.keys(require('./package.json').scripts).filter(k=>k.startsWith('test:')).join(' '))"); do
            if timeout 300 npm run -s "$t" > "/tmp/$t.log" 2>&1; then echo "PASS $t"; else echo "FAIL $t"; echo "----- $t -----"; tail -40 "/tmp/$t.log"; fail=1; fi
          done
          exit $fail
      - run: node scripts/test-reminder-cron.cjs
      - run: npm run build
