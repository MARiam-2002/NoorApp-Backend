# Cron: FCM Azan prayer-reminder backup
# Calls the API every 10 minutes.
#
# IMPORTANT — avoid duplicate cron:
# - If you use Railway Cron Jobs for this endpoint, disable this workflow
#   (or remove the schedule trigger).
# - If you keep GitHub Actions, set API_BASE to your Railway public URL
#   (e.g. https://YOUR-SERVICE.up.railway.app/api/v1) and ensure
#   CRON_SECRET matches the Railway service variable.
#
# Requires repo secret CRON_SECRET matching the host CRON_SECRET.

name: Prayer Reminder Cron

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  prayer-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger prayer-reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Set repo variable API_BASE to your Railway URL when migrating off Vercel.
          API_BASE: ${{ vars.API_BASE }}
        run: |
          set -euo pipefail
          API_BASE="${API_BASE:-https://noor-app-backend-one.vercel.app/api/v1}"
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET repo secret is not set. Add it to match the host CRON_SECRET."
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-out.json -w "%{http_code}" \
            -X POST "${API_BASE}/cron/prayer-reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP ${code}"
          cat /tmp/cron-out.json
          test "${code}" = "200"
