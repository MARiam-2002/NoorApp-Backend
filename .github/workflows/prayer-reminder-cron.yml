# DISABLED — production prayer-reminder cron is Railway Cron only.
#
# Schedule on Railway: */10 * * * *
# Command:
#   curl -fsS -X POST "https://noorapp-backend-production.up.railway.app/api/v1/cron/prayer-reminders" \
#     -H "Authorization: Bearer ${CRON_SECRET}" \
#     -H "Content-Type: application/json"
#
# This GitHub Actions workflow intentionally has no schedule and does not run,
# so there is exactly ONE production scheduler (Railway).

name: Prayer Reminder Cron (DISABLED)

on:
  # No production triggers. Emergency manual only if explicitly confirmed.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ENABLE to force a one-off trigger (prefer Railway Cron)'
        required: true
        default: ''

jobs:
  prayer-reminders:
    if: ${{ github.event.inputs.confirm == 'ENABLE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger prayer-reminders (emergency only)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_BASE: ${{ vars.API_BASE }}
        run: |
          set -euo pipefail
          API_BASE="${API_BASE:-}"
          if [ -z "${API_BASE}" ]; then
            echo "Set repo variable API_BASE to your Railway /api/v1 base URL."
            exit 1
          fi
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET repo secret is not set."
            exit 1
          fi
          code=$(curl -sS -o /tmp/cron-out.json -w "%{http_code}" \
            -X POST "${API_BASE}/cron/prayer-reminders" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP ${code}"
          cat /tmp/cron-out.json
          test "${code}" = "200"
